edition = "2026";

package tests.editions2026;

enum Kind {
  KIND_UNKNOWN = 0;
  KIND_ONE = 1;
}

message Defaults {
  message Child {
    int32 a = 1;
  }

  // Edition 2026 keeps the edition 2023 defaults for all runtime features.
  int32 number = 1;
  string text = 2;
  Kind kind = 3;
  repeated int32 numbers = 4;
  Child child = 5;
  int32 implicit_number = 6 [features.field_presence = IMPLICIT];
}
